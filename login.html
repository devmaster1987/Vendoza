<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vendoza - Login</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body>
    <header class="header">
      <nav class="navbar container">
        <a href="index.html" class="logo"> Vendoza </a>

        <div class="nav-actions">
          <a href="index.html"> Home </a>

          <a href="cart.html"> Cart </a>
        </div>
      </nav>
    </header>

    <main>
      <section class="auth-page">
        <div class="container">
          <div class="auth-card">
            <h1>Welcome Back</h1>

            <p class="subtitle">Login to your Vendoza account</p>

            <form class="auth-form" id="loginForm">
              <div class="auth-group">
                <label> Email </label>

                <input
                  type="email"
                  id="loginEmail"
                  placeholder="Enter email"
                  required
                />
              </div>

              <div class="auth-group">
                <label> Password </label>

                <input
                  type="password"
                  id="loginPassword"
                  placeholder="Enter password"
                  required
                />
              </div>

              <button type="submit" class="btn auth-btn">Login</button>

              <p class="auth-message" id="authMessage"></p>
            </form>

            <div class="auth-footer">
              Don't have an account?

              <a href="register.html"> Create Account </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">© 2026 Vendoza. All rights reserved.</div>
      </div>
    </footer>

    <script src="js/auth.js"></script>
  </body>
</html>
