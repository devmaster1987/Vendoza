<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vendoza Products Management</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/admin.css" />

    <link rel="stylesheet" href="css/products-admin.css" />
  </head>

  <body>
    <script>
      if (localStorage.getItem("vendozaAdmin") !== "true") {
        window.location.href = "admin-login.html";
      }
    </script>

    <main class="admin-page">
      <div class="container">
        <div class="admin-layout">
          <!-- SIDEBAR -->

          <aside class="admin-sidebar">
            <div class="admin-logo">
              Vendoza
              <span> Admin </span>
            </div>

            <nav class="admin-menu">
              <a href="admin.html"> 📊 Dashboard </a>

              <a href="products-admin.html" class="active"> 📦 Products </a>

              <a href="orders-admin.html"> 🛒 Orders </a>

              <button id="adminLogout">Logout</button>
            </nav>
          </aside>

          <!-- CONTENT -->

          <section class="admin-content">
            <div class="admin-header">
              <div>
                <p>Manage Store Products</p>

                <h1>Products Management</h1>
              </div>

              <button class="btn" id="openForm">+ Add Product</button>
            </div>

            <!-- ADD PRODUCT -->

            <div class="admin-card product-form-card" id="productFormBox">
              <h2>Add New Product</h2>

              <form id="productForm" class="product-form">
                <input id="productName" placeholder="Product Name" required />

                <input
                  id="productPrice"
                  type="number"
                  placeholder="Price"
                  required
                />

                <input id="productCategory" placeholder="Category" required />

                <input id="productImage" placeholder="Image URL" required />

                <input
                  id="productStock"
                  type="number"
                  placeholder="Stock Quantity"
                  required
                />

                <button class="btn">Save Product</button>
              </form>
            </div>

            <!-- PRODUCTS TABLE -->

            <div class="admin-card">
              <div class="product-toolbar">
                <h2>All Products</h2>

                <input id="searchProduct" placeholder="Search products..." />
              </div>

              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Image</th>

                    <th>Name</th>

                    <th>Category</th>

                    <th>Price</th>

                    <th>Stock</th>

                    <th>Action</th>
                  </tr>
                </thead>

                <tbody id="productTable"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="js/products-admin.js"></script>
  </body>
</html>
