<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vendoza - Wishlist</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/product.css" />

    <link rel="stylesheet" href="css/wishlist.css" />
  </head>

  <body>
    <header class="header">
      <nav class="navbar container">
        <a href="index.html" class="logo"> Vendoza </a>

        <div class="nav-actions">
          <a href="index.html"> Home </a>

          <a href="cart.html"> Cart </a>
        </div>
      </nav>
    </header>

    <main>
      <section class="wishlist-page">
        <div class="container">
          <h1 class="wishlist-title">My Wishlist</h1>

          <div class="wishlist-grid" id="wishlistContainer"></div>

          <div class="wishlist-empty" id="wishlistEmpty" style="display: none">
            <h3>Your wishlist is empty</h3>

            <p>Save your favorite products here.</p>

            <a href="index.html" class="btn"> Continue Shopping </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">© 2026 Vendoza. All rights reserved.</div>
      </div>
    </footer>

    <script src="js/products.js"></script>

    <script src="js/cart.js"></script>

    <script src="js/wishlist.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
