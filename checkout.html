<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vendoza - Checkout</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/checkout.css" />
  </head>

  <body>
    <header class="header">
      <nav class="navbar container">
        <a href="index.html" class="logo"> Vendoza </a>

        <div class="nav-actions">
          <a href="index.html"> Continue Shopping </a>

          <a href="cart.html"> Cart </a>
        </div>
      </nav>
    </header>

    <main>
      <section class="checkout-page">
        <div class="container">
          <h1 class="checkout-title">Checkout</h1>

          <div class="checkout-container">
            <div class="checkout-form">
              <h2>Shipping Information</h2>

              <form id="checkoutForm">
                <div class="form-group">
                  <label> Full Name </label>

                  <input type="text" placeholder="Enter your name" />
                </div>

                <div class="form-group">
                  <label> Email </label>

                  <input type="email" placeholder="Enter your email" />
                </div>

                <div class="form-group">
                  <label> Phone Number </label>

                  <input type="tel" placeholder="Phone number" />
                </div>

                <div class="form-group">
                  <label> Address </label>

                  <textarea placeholder="Enter shipping address"></textarea>
                </div>

                <div class="form-group">
                  <label> City </label>

                  <input type="text" placeholder="City" />
                </div>

                <h2>Payment Method</h2>

                <div class="payment-options">
                  <label class="payment-option">
                    <input type="radio" name="payment" checked />

                    Cash On Delivery
                  </label>

                  <label class="payment-option">
                    <input type="radio" name="payment" />

                    Credit / Debit Card
                  </label>
                </div>

                <button type="submit" class="btn place-order-btn">
                  Place Order
                </button>
              </form>
            </div>

            <aside class="checkout-summary">
              <h2>Your Order</h2>

              <div class="order-item">
                <span> Subtotal </span>

                <strong> $0.00 </strong>
              </div>

              <div class="order-item">
                <span> Shipping </span>

                <strong> Free </strong>
              </div>

              <div class="summary-total">
                <span> Total </span>

                <strong> $0.00 </strong>
              </div>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">© 2026 Vendoza. All rights reserved.</div>
      </div>
    </footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/checkout.js"></script>
<script src="js/main.js"></script>
  </body>
</html>
