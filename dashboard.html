<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vendoza Dashboard</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <header class="header">
      <nav class="navbar container">
        <a href="index.html" class="logo"> Vendoza<span>.</span> </a>

        <div class="nav-actions">
          <a href="index.html"> Shop </a>

          <a href="cart.html"> 🛒 Cart </a>
        </div>
      </nav>
    </header>

    <main>
      <section class="dashboard-page">
        <div class="container">
          <div class="dashboard-layout">
            <!-- SIDEBAR -->

            <aside class="dashboard-sidebar">
              <div class="profile-card">
                <div class="user-avatar">V</div>

                <h3 id="userName">User</h3>

                <p id="userEmail">user@email.com</p>
              </div>

              <nav class="dashboard-menu">
                <a href="#" class="active"> 📊 Dashboard </a>

                <a href="orders.html"> 📦 My Orders </a>

                <a href="wishlist.html"> ❤️ Wishlist </a>

                <a href="#"> ⚙ Account Settings </a>

                <button class="logout-btn" id="logoutBtn">Logout</button>
              </nav>
            </aside>

            <!-- CONTENT -->

            <div class="dashboard-content">
              <div class="dashboard-welcome">
                <div>
                  <p>Welcome back 👋</p>

                  <h1>Your Account Dashboard</h1>
                </div>

                <a href="index.html" class="btn"> Continue Shopping </a>
              </div>

              <!-- STATS -->

              <div class="dashboard-stats">
                <div class="stat-box">
                  <span> 📦 </span>

                  <strong id="orderCount"> 0 </strong>

                  <p>Total Orders</p>
                </div>

                <div class="stat-box">
                  <span> 💰 </span>

                  <strong id="totalSpent"> $0 </strong>

                  <p>Total Spent</p>
                </div>

                <div class="stat-box">
                  <span> ❤️ </span>

                  <strong> 0 </strong>

                  <p>Wishlist Items</p>
                </div>

                <div class="stat-box">
                  <span> ⭐ </span>

                  <strong> 0 </strong>

                  <p>Reward Points</p>
                </div>
              </div>

              <!-- PROFILE -->

              <div class="dashboard-card">
                <div class="card-header">
                  <h2>Profile Information</h2>

                  <button>Edit</button>
                </div>

                <div class="profile-info">
                  <div>
                    <label> Name </label>

                    <p id="profileName"></p>
                  </div>

                  <div>
                    <label> Email </label>

                    <p id="profileEmail"></p>
                  </div>

                  <div>
                    <label> Account Status </label>

                    <p>Active</p>
                  </div>
                </div>
              </div>

              <!-- RECENT ORDERS -->

              <div class="dashboard-card">
                <div class="card-header">
                  <h2>Recent Orders</h2>

                  <a href="orders.html"> View All </a>
                </div>

                <div id="recentOrders"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/dashboard.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
