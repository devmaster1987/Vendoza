<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vendoza Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <script>
      if (localStorage.getItem("vendozaAdmin") !== "true") {
        window.location.href = "admin-login.html";
      }
    </script>

    <main class="admin-page">
      <div class="container">
        <div class="admin-layout">
          <!-- SIDEBAR -->

          <aside class="admin-sidebar">
            <div class="admin-logo">
              Vendoza
              <span> Admin </span>
            </div>

            <nav class="admin-menu">
              <a class="active" href="admin.html"> 📊 Dashboard </a>

              <a href="products-admin.html"> 📦 Products </a>

              <a href="orders-admin.html"> 🛒 Orders </a>

              <a href="#"> 👥 Customers </a>

              <a href="#"> ⚙ Settings </a>

              <button id="adminLogout">Logout</button>
            </nav>
          </aside>

          <!-- CONTENT -->

          <section class="admin-content">
            <div class="admin-header">
              <div>
                <p>Welcome back 👋</p>

                <h1>Admin Dashboard</h1>
              </div>

              <a href="index.html" class="btn"> View Store </a>
            </div>

            <!-- STATS -->

            <div class="admin-stats">
              <div class="admin-stat">
                <span> 📦 </span>

                <strong id="productCount"> 0 </strong>

                <p>Products</p>
              </div>

              <div class="admin-stat">
                <span> 🛒 </span>

                <strong id="orderCount"> 0 </strong>

                <p>Orders</p>
              </div>

              <div class="admin-stat">
                <span> 💰 </span>

                <strong id="revenue"> $0 </strong>

                <p>Revenue</p>
              </div>

              <div class="admin-stat">
                <span> 👥 </span>

                <strong id="customerCount"> 0 </strong>

                <p>Customers</p>
              </div>
            </div>

            <!-- RECENT ORDERS -->

            <div class="admin-card">
              <div class="card-header">
                <h2>Recent Orders</h2>

                <a href="orders-admin.html"> View All </a>
              </div>

              <div id="recentOrders"></div>
            </div>

            <!-- TOP PRODUCTS -->

            <div class="admin-card">
              <div class="card-header">
                <h2>Top Products</h2>
              </div>

              <div id="topProducts"></div>
            </div>

            <!-- SALES ANALYTICS -->

            <div class="admin-card">
              <div class="card-header">
                <h2>Sales Analytics</h2>
              </div>

              <div class="chart-box">
                <canvas id="salesChart"></canvas>
              </div>
            </div>

            <!-- ORDER STATUS + LOW STOCK -->

            <div class="dashboard-grid">
              <div class="admin-card">
                <div class="card-header">
                  <h2>Order Overview</h2>
                </div>

                <div id="orderStatus"></div>
              </div>

              <div class="admin-card">
                <div class="card-header">
                  <h2>Low Stock Alert</h2>
                </div>

                <div id="lowStock"></div>
              </div>
            </div>

            <!-- RECENT ACTIVITY -->

            <div class="admin-card">
              <div class="card-header">
                <h2>Recent Activity</h2>
              </div>

              <div id="activityList"></div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
